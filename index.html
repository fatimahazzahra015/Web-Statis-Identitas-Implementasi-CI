<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identitas Mahasiswa</title>
  <style>
    /* ==== GLOBAL STYLE ==== */
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #a8edea, #fed6e3);
      color: #222;
    }

    /* ==== CARD ==== */
    .card {
      background: #fff;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      text-align: left;
      max-width: 400px;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
    }

    /* ==== TEXT ==== */
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      font-size: 24px;
      letter-spacing: 1px;
      border-bottom: 2px solid #ff8fab;
      padding-bottom: 8px;
    }

    p {
      margin: 10px 0;
      font-size: 16px;
    }

    strong {
      color: #444;
    }

    /* ==== FOOTER ==== */
    footer {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      font-size: 13px;
      color: #555;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Identitas Mahasiswa</h1>
    <p><strong>Nama:</strong> Fatimah Azzahra</p>
    <p><strong>NIM:</strong> 230411100015</p>
    <p><strong>Kelas:</strong> PPL D</p>
    <p><strong>Program Studi:</strong> Teknik Informatika</p>
    <p><strong>Universitas:</strong> Universitas Trunojoyo Madura</p>
  </div>

  <footer>
    © 23-015 Fatimah Azzahra — Teknik Informatika UTM
  </footer>
</body>
</html>
